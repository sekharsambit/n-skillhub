version: "3.9"

services:
  registry-server:
    build:
      context: .
      dockerfile: apps/registry-server/Dockerfile
    container_name: nitor-skillhub-registry
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REGISTRY_DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - nitor-registry-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nitor-registry-data:
    driver: local
